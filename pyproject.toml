[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fak-log-analyzer"
version = "0.5.1"
description = "A lightweight CLI log analysis tool"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Fardeen Ahmad Khan", email = "fardeenahmadkhan786@gmail.com" }
]
keywords = [
    "log-analyzer",
    "logs",
    "devops",
    "cli",
    "monitoring",
    "sre"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "rich>=13.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8"
]

[project.scripts]
fak-log-analyzer = "fak_log_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.fak_log_analyzer]
author_designation = "Assistant Professor of Computer Science Engineering"